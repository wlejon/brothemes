name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The library has no sibling dependencies. Its JavaScript api (brothemes_api,
# BROTHEMES_ENABLE_API, on when brothemes is the top-level project) binds
# bronze, so every job lays out bronze and brass beside the checkout with
# bronze's checkout-toolchain action:
#
#     $GITHUB_WORKSPACE/
#       brothemes/  <- this repo, checked out into a named path, not the root
#       bronze/     <- the JavaScript runtime brothemes_api binds
#       brass/      <- bronze's code generator
#
# bronze and brass compile inside this build tree with the job's own compiler
# and CRT, which makes brothemes_test_api the check that the library works the
# way bro uses it. The differential oracle reads the iTerm2-Color-Schemes
# files from tests/data/iterm2-color-schemes.bpk, an in-repo archive, so
# nothing is downloaded either.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brothemes

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brothemes -B build
          else
            cmake -S brothemes -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -j 2

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Scoped to the library's src/ and include/: tools/pack is the test data's
  # archive codec, not part of what brothemes ships. Debug (-O0), so this is
  # also the Linux job where assert()s are live.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brothemes

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install gcovr + Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr ninja-build

      - name: Configure (instrumented)
        run: |
          cmake -S brothemes -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROTHEMES_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 2

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      #
      # Run from the workspace root, where build/ is, with the filters spelled
      # brothemes/...: gcovr only looks for .gcda files under its root.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brothemes/src/' --filter 'brothemes/include/brothemes/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/brothemes/`'
            echo
            echo '`tools/pack` (the codec the oracle data ships in) is excluded: it is test infrastructure, not library code.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
